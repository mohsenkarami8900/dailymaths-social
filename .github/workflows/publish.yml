name: Publish to Instagram & Facebook

on:
  schedule:
    # UTC times. GitHub sometimes starts scheduled runs late (even hours), so we
    # check every 10 minutes; these cover the hour after each slot in both UK
    # winter (GMT) and summer (BST) time. The first run after the slot posts and
    # data/state.json stops any second post.
    #   Thursday 18:00 UK  -> 17:00-18:50 UTC
    #   Saturday 05:00 UK  -> 04:00-05:50 UTC
    - cron: "*/10 17-18 * * 4"
    - cron: "*/10 4-5 * * 6"
  workflow_dispatch:
    inputs:
      kinds:
        description: "What to post: auto (whatever is still missing today) or story, reel, carousel"
        type: string
        default: "auto"
      dry_run:
        description: "Preview only: send to my Telegram, don't publish"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest state (an earlier run may have just posted)
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what to post
        id: plan
        env:
          KINDS: ${{ inputs.kinds }}
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python run_publish.py plan

      - name: Install tools
        if: steps.plan.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Create images and videos
        if: steps.plan.outputs.go == 'true'
        env:
          KINDS: ${{ steps.plan.outputs.kinds }}
          DAY: ${{ steps.plan.outputs.day }}
        run: python run_publish.py build

      - name: Wait until posting time
        if: steps.plan.outputs.go == 'true'
        run: python run_publish.py wait

      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.go == 'true'
        with:
          path: site

      - name: Put media online
        id: deploy
        if: steps.plan.outputs.go == 'true'
        uses: actions/deploy-pages@v4

      - name: Publish
        if: steps.plan.outputs.go == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.page_url }}
          DRY_RUN: ${{ inputs.dry_run }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python run_publish.py publish

      - name: Save state
        if: always()
        run: |
          git config user.name "dailymaths-bot"
          git config user.email "dailymaths-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git pull --rebase && git push)
